<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1220" viewBox="0 0 1100 1220" role="img" aria-labelledby="title desc"><title id="title">What I build</title><desc id="desc">Natural-language intent routing into log and case retrieval, role-specific analysis, playbooks, and operational tools across SIEM, SOAR, IAM, application security, OT, and firewall workflows. Browser-guided discovery links sensitive fields to application evidence. Reviewed, role-specific policy plans lead to approved Casbin enforcement on an instrumented application, followed by runtime validation. Certificate discovery, requests, approvals, issuance, renewal, and revocation, alongside cryptographic inventories, shared-asset correlation, and rule-based post-quantum readiness assessment.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.outline{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="1" y="1" width="1098" height="1218" rx="22" fill="#15171d" stroke="#3b3349"/><text x="32" y="43" font-size="14" fill="#f2bb79" class="mono" letter-spacing="2">WHAT I BUILD</text><text x="1068" y="43" font-size="12" fill="#b3a7bf" class="mono" text-anchor="end">WORKFLOW ILLUSTRATIONS</text><rect x="22" y="70" width="1056" height="356" rx="18" fill="#1e1e29" stroke="#3b3349"/><rect x="22" y="92" width="3" height="54" rx="1.5" fill="#f2bb79"/><text x="44" y="106" font-size="13" fill="#f2bb79" class="mono" >01 / SECURITY OPERATIONS</text><text x="44" y="161" font-size="34" fill="#f6ecdf" font-weight="650" letter-spacing="-.6">A question becomes</text><text x="44" y="203" font-size="34" fill="#f6ecdf" font-weight="650" letter-spacing="-.6">an investigation.</text><text x="44" y="255" font-size="12" fill="#f2bb79" class="mono" >SIEM / SOAR / IAM / APPSEC / OT / FIREWALL</text><text x="44" y="337" font-size="18" fill="#b3a7bf" >Python / CrewAI</text><text x="44" y="366" font-size="18" fill="#b3a7bf" >LangChain / FastAPI</text><path d="M457 