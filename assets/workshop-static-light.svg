<svg width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="workshop-svg-title workshop-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="workshop-svg-title">Santhosh's Midnight Workshop</title>
      <desc id="workshop-desc">An amber and violet workshop for security platforms, agentic systems, and developer tools. The lamp glows briefly, then rests. Equivalent text follows in the README.</desc>

<defs>
        <radialGradient id="roomglow"><stop stop-color="#e6d4e0"/><stop offset="1" stop-color="#f7f3ed"/></radialGradient>
