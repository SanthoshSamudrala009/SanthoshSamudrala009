<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1875" viewBox="0 0 600 1875" role="img" aria-labelledby="title desc"><title id="title">What I build</title><desc id="desc">Natural-language intent routing into log and case retrieval, role-specific analysis, playbooks, and operational tools across SIEM, SOAR, IAM, application security, OT, and firewall workflows. Browser-guided discovery links sensitive fields to application evidence. Reviewed, role-specific policy plans lead to approved Casbin enforcement on an instrumented application, followed by runtime validation. Certificate discovery, requests, approvals, issuance, renewal, and revocation, alongside cryptographic inventories, shared-asset correlation, and rule-based post-quantum readiness assessment.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.outline{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="1" y="1" width="598" height="1873" rx="22" fill="#f7f3ed" stroke="#d8cbdc"/><text x="32" y="43" font-size="16" fill="#9b612a" class="mono" letter-spacing="2">WHAT I BUILD</text><rect x="20" y="70" width="560" height="579" rx="18" fill="#fffdf9" stroke="#d8cbdc"/><rect x="20" y="92" width="3" height="54" rx="1.5" fill="#9b612a"/><text x="42" y="106" font-size="17" fill="#9b612a" class="mono" >01 / SECURITY OPERATIONS</text><text x="42" y="161" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">A question becomes</text><text x="42" y="203" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">an investigation.</text><g transform="translate(30 231)"><rect x="145" y="7" width="245" height="44" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><text x="268" y="36" font-size="21" fill="#302b38" text-anchor="middle">A security question</text><path d="M268 51V78" fill="none" stroke="#9b612a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="185" y="80" width="165" height="53" rx="12" fill="#fffdf9" stroke="#9b612a"/><text x="267.5" y="112.5" font-size="22" fill="#302b38" text-anchor="middle">Intent router</text><path d="M268 133V155H87V179M268 155V179M268 155H450V179" fill="none" stroke="#79609f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="15" y="180" width="145" height="76" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><g transform="translate(68 190) scale(0.5625)" class="outline" stroke="#79609f" stroke-width="2.7"><ellipse cx="32" cy="13" rx="22" ry="8"/><path d="M10 13V49C10 60 54 60 54 49V13M10 30c0 11 44 11 44 0M10 46c0 11 44 11 44 0"/></g><text x="87" y="247" font-size="13" fill="#736579" class="mono" text-anchor="middle">LOGS / CASES</text><rect x="196" y="180" width="145" height="76" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><g transform="translate(249 190) scale(0.5625)" class="outline" stroke="#79609f" stroke-width="2.7"><rect x="13" y="27" width="38" height="30" rx="5"/><path d="M21 27V17a11 11 0 0 1 22 0v10M32 38v9"/></g><text x="268" y="247" font-size="13" fill="#736579" class="mono" text-anchor="middle">IAM / APPSEC</text><rect x="377" y="180" width="145" height="76" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><g transform="translate(430 190) scale(0.5625)" class="outline" stroke="#79609f" stroke-width="2.7"><path d="M32 5 54 14V31C54 44 42 53 32 59 22 53 10 44 10 31V14Z"/><path d="m22 31 7 8 15-17"/></g><text x="449" y="247" font-size="13" fill="#736579" class="mono" text-anchor="middle">OT / FIREWALL</text><text x="268" y="294" font-size="20" fill="#302b38" text-anchor="middle">Evidence → analysis → playbooks</text></g><text x="42" y="579" font-size="15" fill="#9b612a" class="mono" >SIEM / SOAR / IAM / APPSEC / OT / FIREWALL</text><text x="42" y="619" font-size="18" fill="#736579" >Python / CrewAI / LangChain / FastAPI</text><rect x="20" y="669" width="560" height="579" rx="18" fill="#fffdf9" stroke="#d8cbdc"/><rect x="20" y="691" width="3" height="54" rx="1.5" fill="#79609f"/><text x="42" y="705" font-size="17" fill="#79609f" class="mono" >02 / DATA PROTECTION</text><text x="42" y="760" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">Discover the data.</text><text x="42" y="802" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">Control the exposure.</text><g transform="translate(30 830)"><rect x="8" y="40" width="140" height="172" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><path d="M8 71H148" fill="none" stroke="#d8cbdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="61" font-size="13" fill="#79609f" class="mono" >BROWSER</text><rect x="23" y="89" width="109" height="23" rx="4" fill="#e8dfed" stroke="#d8cbdc"/><rect x="23" y="125" width="109" height="23" rx="4" fill="#e8dfed" stroke="#d8cbdc"/><rect x="23" y="161" width="109" height="23" rx="4" fill="#e8dfed" stroke="#d8cbdc"/><path d="M33 100H96M33 136H78M33 172H108" fill="none" stroke="#79609f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M151 126H188m-6-5 6 5-6 5" fill="none" stroke="#79609f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="194" y="40" width="144" height="172" rx="12" fill="#fffdf9" stroke="#d8cbdc"/><text x="210" y="66" font-size="13" fill="#9b612a" class="mono" >POLICY PLAN</text><path d="M208 79H324M208 117H324M208 155H324M250 79V194M290 79V194" fill="none" stroke="#d8cbdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="218" y="105" font-size="12" fill="#736579" class="mono" >R1</text><text x="218" y="143" font-size="12" fill="#736579" class="mono" >R2</text><text x="218" y="181" font-size="12" fill="#736579" class="mono" >R3</text><rect x="263" y="98" width="12" height="12" rx="3" fill="#5e7e54"/><rect x="302" y="98" width="12" height="12" rx="3" fill="#9b612a"/><rect x="263" y="136" width="12" height="12" rx="3" fill="#9b612a"/><rect x="302" y="136" width="12" height="12" rx="3" fill="#79609f"/><rect x="263" y="174" width="12" height="12" rx="3" fill="#79609f"/><rect x="302" y="174" width="12" height="12" rx="3" fill="#5e7e54"/><path d="M342 126H384m-6-5 6 5-6 5" fill="none" stroke="#9b612a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M411 95 442 126 411 157 380 126Z" fill="#e8dfed" stroke="#9b612a"/><g transform="translate(395 109) scale(0.5)" class="outline" stroke="#9b612a" stroke-width="2.7"><circle cx="32" cy="17" r="9"/><circle cx="12" cy="27" r="7"/><circle cx="52" cy="27" r="7"/><path d="M18 55V45c0-17 28-17 28 0V55M2 52V44c0-9 8-13 15-9M62 52V44c0-9-8-13-15-9"/></g><text x="411" y="84" font-size="13" fill="#9b612a" class="mono" text-anchor="middle">APPROVAL</text><path d="M446 126H479m-6-5 6 5-6 5" fill="none" stroke="#5e7e54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(481 95) scale(1.015625)" class="outline" stroke="#5e7e54" stroke-width="2.7"><path d="M32 5 54 14V31C54 44 42 53 32 59 22 53 10 44 10 31V14Z"/><path d="m22 31 7 8 15-17"/></g><text x="513" y="187" font-size="13" fill="#5e7e54" class="mono" text-anchor="middle">APPLY</text><text x="268" y="260" font-size="19" fill="#302b38" text-anchor="middle">Discover → review → apply → verify</text><text x="268" y="290" font-size="12" fill="#736579" class="mono" text-anchor="middle">POLICY ENFORCEMENT + RUNTIME CHECKS</text></g><text x="42" y="1178" font-size="15" fill="#79609f" class="mono" >BROWSER EVIDENCE / REVIEWED POLICIES</text><text x="42" y="1218" font-size="18" fill="#736579" >Playwright / LangGraph / Casbin / Python</text><rect x="20" y="1268" width="560" height="579" rx="18" fill="#fffdf9" stroke="#d8cbdc"/><rect x="20" y="1290" width="3" height="54" rx="1.5" fill="#5e7e54"/><text x="42" y="1304" font-size="17" fill="#5e7e54" class="mono" >03 / CERTIFICATES + CRYPTO</text><text x="42" y="1359" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">Manage the lifecycle.</text><text x="42" y="1401" font-size="35" fill="#302b38" font-weight="650" letter-spacing="-.6">Understand the risk.</text><g transform="translate(30 1429)"><text x="10" y="24" font-size="14" fill="#9b612a" class="mono" >CERTIFICATE LIFECYCLE</text><g transform="translate(5 49) scale(0.890625)" class="outline" stroke="#9b612a" stroke-width="2.7"><rect x="12" y="5" width="39" height="50" rx="4"/><path d="M21 17H42M21 25H40M21 33H32"/><circle cx="40" cy="43" r="8"/><path d="m35 50-2 10 7-4 7 4-2-10"/></g><path d="M69 79H102m-6-5 6 5-6 5" fill="none" stroke="#9b612a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="106" y="55" width="110" height="48" rx="12" fill="#fffdf9" stroke="#9b612a"/><text x="161.0" y="85.0" font-size="17" fill="#302b38" text-anchor="middle">Request</text><path d="M220 79H242m-6-5 6 5-6 5" fill="none" stroke="#9b612a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="246" y="55" width="110" height="48" rx="12" fill="#fffdf9" stroke="#9b612a"/><text x="301.0" y="85.0" font-size="17" fill="#302b38" text-anchor="middle">Approve</text><path d="M360 79H382m-6-5 6 5-6 5" fill="none" stroke="#9b612a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="386" y="55" width="154" height="48" rx="12" fill="#fffdf9" stroke="#9b612a"/><text x="463.0" y="85.0" font-size="17" fill="#302b38" text-anchor="middle">Issue / renew</text><text x="10" y="168" font-size="14" fill="#79609f" class="mono" >CRYPTOGRAPHIC POSTURE</text><g transform="translate(5 192) scale(0.890625)" class="outline" stroke="#79609f" stroke-width="2.7"><ellipse cx="32" cy="13" rx="22" ry="8"/><path d="M10 13V49C10 60 54 60 54 49V13M10 30c0 11 44 11 44 0M10 46c0 11 44 11 44 0"/></g><path d="M69 222H102m-6-5 6 5-6 5" fill="none" stroke="#79609f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="106" y="198" width="110" height="48" rx="12" fill="#fffdf9" stroke="#79609f"/><text x="161.0" y="228.0" font-size="17" fill="#302b38" text-anchor="middle">Inventory</text><path d="M220 2