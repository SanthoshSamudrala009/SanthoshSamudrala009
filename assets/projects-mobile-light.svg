<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1240" viewBox="0 0 600 1240" role="img" aria-labelledby="title desc"><title id="title">The workbench</title><desc id="desc">Certificate management and crypto agility. Bringing certificate management, cryptographic assessment, and AI-assisted operations into one platform, with a Python API and a React interface. Agents for security and data protection. LLM-guided browser exploration, retrieval-backed security assistants, and role-aware data protection workflows. I work on the path from finding evidence to taking a useful next step. MCP tools with tangible outputs. Tools that turn an agent&#x27;s work into Word reports and Excel workbooks, with file delivery through cloud storage. Small interfaces that make automation useful beyond the chat window.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.outline{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="1" y="1" width="598" height="1238" rx="22" fill="#f7f3ed" stroke="#d8cbdc"/><text x="32" y="45" font-size="18" fill="#9b612a" class="mono" letter-spacing="2">THE WORKBENCH</text><text x="568" y="45" font-size="15" fill="#736579" text-anchor="end" class="mono">PRIVATE BUILDS</text><rect x="24" y="72" width="552" height="366" rx="17" fill="#fffdf9" stroke="#d8cbdc"/><text x="46" y="106" font-size="16" fill="#9b612a" class="mono" letter-spacing="1">01 / GUARD + GOVERN</text><text x="48" y="158" font-size="31" fill="#302b38" font-weight="650">Certificates</text><text x="48" y="196" font-size="31" fill="#302b38" font-weight="650">&amp; crypto agility</text><g transform="translate(276 195) scale(0.95)"><ellipse cx="145" cy="172" rx="125" ry="20" fill="#e8dfed"/><path d="M60 100H231" fill="none" stroke="#d8cbdc" stroke-width="2" stroke-dasharray="4 7"/><g transform="translate(15 55) scale(1.359375)" class="outline" stroke="#79609f" stroke-width="2.7"><rect x="12" y="5" width="39" height="50" rx="4"/><pa