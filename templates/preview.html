<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} / Midnight Workshop</title>
<style>
:root { color-scheme:dark; --bg:#101116; --ink:#f1ebe6; --muted:#b1a7b8; --line:#37313e; --accent:#f0ba79; }
:root[data-theme=light] { color-scheme:light; --bg:#fffdf9; --ink:#302b38; --muted:#6d6071; --line:#d9cdd8; --accent:#925b2a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,sans-serif; }
main { max-width:1100px; padding:24px 24px 40px; margin:auto; }
header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:20px; }
.eyebrow { font:11px/1.5 ui-monospace,monospace; letter-spacing:.13em; color:var(--accent); }
button { background:transparent; border:1px solid var(--line); color:var(--ink); padding:8px 12px; border-radius:7px; cursor:pointer; }
button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
.controls { display:flex; gap:8px; }
picture { display:block; margin-bottom:18px; }
img { display:block; width:100%; height:auto; border-radius:18px; }
a { color:var(--accent); text-underline-offset:4px; }
details { color:var(--muted); margin:20px 0; }
summary { cursor:pointer; color:var(--muted); font-size:13px; }
table { border-collapse:collapse; width:100%; }
td,th { padding:7px 12px; border-bottom:1px solid var(--line); text-align:left; }
footer { color:var(--muted); font-size:11px; }
@media(max-width:600px) { main { padding:16px 12px 30px; } header>.eyebrow { max-width:120px; } button { font-size:11px; } .controls { flex-wrap:wrap; justify-content:flex-end; } picture { margin-bottom:12px; } }
</style>
</head>
<body><main>
<header><div class="eyebrow">MIDNIGHT WORKSHOP / PREVIEW</div><div class="controls"><button id="theme" type="button" aria-pressed="false">Light theme</button><button id="motion" type="button" aria-pressed="false">Static artwork</button></div></header>
{{PANELS}}
<details><summary>Text version &amp; data notes</summary>{{TEXT}}</details>
<footer><a href="../README.md">README source</a> · GitHub provides its own spacing. Preview controls stay here.</footer>
</main>
<script>
const params=new URLSearchParams(location.search);
let light=params.get('theme')==='light';
let still=params.get('static')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches;
function update(){
  const tone=light?'light':'dark';document.documentElement.dataset.theme=tone;
  document.querySelectorAll('picture').forEach(picture=>{
    const stem=picture.dataset.panel;
    picture.querySelectorAll('source').forEach(source=>{
      const mobile=source.media.includes('max-width');
      source.media=mobile?'(max-width: 600px)':'(min-width: 601px)';
      const variant=(stem==='workshop'&&still?'static-':'')+(mobile?'mobile-':'');
      source.srcset='../assets/'+stem+'-'+variant+tone+'.svg';
    });
    picture.querySelector('img').src='../assets/'+stem+'-'+(stem==='workshop'&&still?'static-':'')+tone+'.svg';
  });
  const theme=document.querySelector('#theme'),motion=document.querySelector('#motion');
  theme.textContent=light?'Dark theme':'Light theme';theme.setAttribute('aria-pressed',String(light));
  motion.textContent=still?'Play intro':'Static artwork';motion.setAttribute('aria-pressed',String(still));
}
document.querySelector('#theme').addEventListener('click',()=>{light=!light;update();});
document.querySelector('#motion').addEventListener('click',()=>{still=!still;update();});update();
</script>
</body></html>
